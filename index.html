<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suis-je concerné ? — Diagnostic facturation électronique auto-entrepreneur</title>
  <meta name="description" content="Réponds à 3 questions pour savoir en 2 minutes si tu es concerné par la réforme de la facturation électronique 2026, tes obligations et les échéances à connaître." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Formulaire statique caché : uniquement pour que Netlify détecte le form au moment du build.
       Le formulaire réellement utilisé est injecté en JS dans renderResult(). -->
  <form name="alerte-facturation" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="alerte-facturation" />
    <input name="bot-field" />
    <input type="email" name="email" />
  </form>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
