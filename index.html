<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suis-je concerné ? — Diagnostic facturation électronique</title>
  <meta name="description" content="Diagnostic gratuit en 3 questions pour savoir si tu es concerné par la réforme de la facturation électronique, avec des exemples concrets et les sources officielles." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Formulaire statique caché : uniquement pour que Netlify détecte le form au moment du build.
       Le formulaire réellement utilisé est injecté en JS dans renderResult(). -->
  <form name="alerte-facturation" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="alerte-facturation" />
    <input name="bot-field" />
    <input type="email" name="email" />
  </form>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
